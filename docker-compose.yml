services:
  sleepy:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9010:9010"
    volumes:
      - ./data:/sleepy/data
    restart: unless-stopped
    environment: # 环境变量配置
      - SLEEPY_DATABASE=sqlite:///data/sleepy.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9010/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  data:
